name: Build DMG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build app
        run: |
          xcodebuild \
            -project "One Display.xcodeproj" \
            -scheme "One Display" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Locate .app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Create DMG
        run: |
          create-dmg \
            --volname "One Display" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "$RUNNER_TEMP/OneDisplay.dmg" \
            "$APP_PATH"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: OneDisplay-DMG
          path: ${{ runner.temp }}/OneDisplay.dmg
